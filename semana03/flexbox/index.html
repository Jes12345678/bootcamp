<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS: flexbox</title>
    <style>
        

    body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .contenedor{
            width: 300px;
            height: 300px;
            background-color: aquamarine;
            display: flex;
            flex-direction: row;
            gap: 5px;
            justify-content: center;
            justify-content: space-between;
            justify-content: space-around;
            align-items: center;

        }
        .box{
            width: 50px;
            height: 50px;
            background-color: blueviolet;
            text-align: center;
            padding: 5px;
        }

    header{
        display: flex;
        flex-direction: row;
        align-items: center;
        width: 100%;
        justify-content: space-between;
    }

    .menu {
        display: flex;
        gap:10px;
    }    

    </style>
</head>
<body>
    <header>
        <h1>Hola Flexbox</h1>
        <nav class="menu">
            <a href="#inicio">Inicio</a>
            <a href="#cursos">Cursos</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>


    <div class="contenedor">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
    </div>
</body>
</html>
